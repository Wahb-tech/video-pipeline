            https://www.instagram.com/crestvalue/reel/DcbWcs2SNw2/
            https://www.instagram.com/crestvalue/reel/DcbWPuEPRqA/
            https://www.instagram.com/crestvalue/reel/DcbWFzMR8Yp/
            https://www.instagram.com/crestvalue/reel/DcbV4VKp-V_/
            https://www.instagram.com/crestvalue/reel/DcbVpfwOwRc/
            https://www.instagram.com/crestvalue/reel/DcYY_l_sxor/
            https://www.instagram.com/crestvalue/reel/DcYYrmoJmzk/
            https://www.instagram.com/crestvalue/reel/DcYYf40PyRc/
            https://www.instagram.com/crestvalue/reel/DcYYVBStDBf/
            https://www.instagram.com/crestvalue/reel/DcYVDcux_rr/
            https://www.instagram.com/crestvalue/reel/DcXGm-cz6Dd/
            https://www.instagram.com/crestvalue/reel/DcWBjWuzetI/
          AUTHORIZED_CREATOR_HANDLES: ""
          AUTHORIZED_TEXT_CREATOR_HANDLES: ""
          AUTHORIZED_SOURCE_OWNER: "@noirwealthlifestyle"
          AUTHORIZED_RESTYLE_SOURCE_OWNER: "@stevenishh"
          ENABLE_CREATOR_RESTYLE: "true"
          ENABLE_AI_CAR_RECOLOR: "true"
          AI_RETOUCH_TIMEOUT_SECONDS: "900"
        run: |
          python -m src.main \
            --style dark_luxury \
            --theme "${{ inputs.theme }}" \
            --copy-variant "${{ inputs.copy_variant }}" \
            --caption-variant "${{ inputs.caption_variant }}" \
            --audio "${{ inputs.audio }}" \
            --duration "${{ inputs.duration }}" \
            --clips "${{ inputs.clips }}" \
            --bpm "${{ inputs.bpm }}"
      - name: Save experiment history
        run: |
          git config user.name "zoop-factory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/generated.csv data/used_stock.csv
          if ! git diff --cached --quiet; then
            git commit -m "Record generated ZOOP experiment"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Upload ZOOP package
        uses: actions/upload-artifact@v4
        with:
          name: zoop-ready-${{ github.run_id }}
          path: |
            output/ZOOP_READY.mp4
            output/caption.txt
            output/post_card.md
            output/EXPERIMENT_ID.txt
            output/creative_plan.json
            output/audio_plan.json
            output/sources.json
            output/rights_manifest.json
          retention-days: 30
      - name: Delete temporary source footage
        if: always()
        run: rm -rf output/work
