name: Generate ZOOP Luxury Video

on:
  workflow_dispatch:
    inputs:
      theme:
        description: Dark luxury theme
        required: true
        type: choice
        default: auto
        options: [auto, dark_cars, money, dark_life, mixed_dark]
      copy_variant:
        description: Overlay text
        required: true
        type: choice
        default: auto
        options: [auto, one_day, soon, none]
      caption_variant:
        description: Caption style
        required: true
        type: choice
        default: auto
        options: [auto, choice, aspiration, minimal]
      audio:
        description: Known audio strategy
        required: true
        type: choice
        default: auto
        options:
          - auto
          - none
          - te_conoci_super_slowed
          - gozalo_super_slowed
          - no_era_amor_super_slowed
          - luz_roja_slowed
          - luna_bala_slowed
          - sempero_super_slowed
          - passo_bem_solto_slowed
      duration:
        description: Duration in seconds
        required: true
        default: "25"
      clips:
        description: Number of cuts
        required: true
        default: "17"
      bpm:
        description: Cut rhythm reference
        required: true
        default: "100"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-urw-base35
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Download authorized music
        env:
          ZOOP_MUSIC_URL: ${{ secrets.ZOOP_MUSIC_URL }}
        run: |
          test -n "$ZOOP_MUSIC_URL"
          curl --fail --location --silent --show-error \
            "$ZOOP_MUSIC_URL" \
            --output /tmp/zoop_music.mp3
          test -s /tmp/zoop_music.mp3
          ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name,duration \
            -of default=noprint_wrappers=1 \
            /tmp/zoop_music.mp3
      - name: Generate video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python -m src.main \
            --style dark_luxury \
            --theme "${{ inputs.theme }}" \
            --copy-variant "${{ inputs.copy_variant }}" \
            --caption-variant "${{ inputs.caption_variant }}" \
            --audio "${{ inputs.audio }}" \
            --music /tmp/zoop_music.mp3 \
            --duration "${{ inputs.duration }}" \
            --clips "${{ inputs.clips }}" \
            --bpm "${{ inputs.bpm }}"
      - name: Save experiment history
        run: |
          git config user.name "zoop-factory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/generated.csv data/used_stock.csv
          if ! git diff --cached --quiet; then
            git commit -m "Record generated ZOOP experiment"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Upload ZOOP package
        uses: actions/upload-artifact@v4
        with:
          name: zoop-ready-${{ github.run_id }}
          path: |
            output/ZOOP_READY.mp4
            output/caption.txt
            output/post_card.md
            output/EXPERIMENT_ID.txt
            output/creative_plan.json
            output/audio_plan.json
            output/sources.json
            output/rights_manifest.json
          retention-days: 30
