name: Generate ZOOP Luxury Video

on:
  workflow_dispatch:
    inputs:
      theme:
        description: Dark luxury theme
        required: true
        type: choice
        default: auto
        options: [auto, dark_cars, money, dark_life, mixed_dark]
      copy_variant:
        description: Overlay text
        required: true
        type: choice
        default: auto
        options: [auto, pov_relationship, future_self, silent_revenge, obsession, standards, discipline, minimal, none]
      caption_variant:
        description: Caption style
        required: true
        type: choice
        default: auto
        options: [auto, choice, aspiration, minimal]
      audio:
        description: Known audio strategy
        required: true
        type: choice
        default: auto
        options:
          - auto
          - none
          - te_conoci_super_slowed
          - gozalo_super_slowed
          - no_era_amor_super_slowed
          - luz_roja_slowed
          - luna_bala_slowed
          - sempero_super_slowed
          - passo_bem_solto_slowed
          - montagem_fuego_super_slowed
      duration:
        description: Duration in seconds
        required: true
        default: "25"
      clips:
        description: Number of cuts
        required: true
        default: "17"
      bpm:
        description: Cut rhythm reference
        required: true
        default: "100"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-urw-base35 tesseract-ocr
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Generate video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          AUTHORIZED_VIDEO_URLS: |
            ${{ secrets.AUTHORIZED_VIDEO_URLS }}
            https://www.instagram.com/noirwealthlifestyle/reel/DX18E6-NS0W/
            https://www.instagram.com/noirwealthlifestyle/reel/DX4d47BN7xC/
            https://www.instagram.com/noirwealthlifestyle/reel/Db_RBfLT057/
            https://www.instagram.com/noirwealthlifestyle/reel/DaZ3ZlgN_9w/
            https://www.instagram.com/noirwealthlifestyle/reel/DaL8vDEN8bP/
            https://www.instagram.com/noirwealthlifestyle/reel/DZjYz3uIixC/
            https://www.instagram.com/noirwealthlifestyle/reel/DZcdXllNcN-/
            https://www.instagram.com/noirwealthlifestyle/reel/DZcdCBBtrdx/
            https://www.instagram.com/noirwealthlifestyle/reel/DZXuyZ4Nqwb/
            https://www.instagram.com/noirwealthlifestyle/reel/DZDTNuZtKTL/
            https://www.instagram.com/noirwealthlifestyle/reel/DYz9WmKta4b/
            https://www.instagram.com/noirwealthlifestyle/reel/DYz8mo9tCaF/
            https://www.instagram.com/noirwealthlifestyle/reel/DYxQMNwtEnK/
            https://www.instagram.com/noirwealthlifestyle/reel/DYfZpeaNTbQ/
            https://www.instagram.com/noirwealthlifestyle/reel/DYfJFaHtgMn/
          AUTHORIZED_TEXT_VIDEO_URLS: |
            ${{ secrets.AUTHORIZED_TEXT_VIDEO_URLS }}
            https://www.instagram.com/crestvalue/reel/Db-_Jq9zX9T/
            https://www.instagram.com/crestvalue/reel/DcbWcs2SNw2/
            https://www.instagram.com/crestvalue/reel/DcbWPuEPRqA/
            https://www.instagram.com/crestvalue/reel/DcbWFzMR8Yp/
            https://www.instagram.com/crestvalue/reel/DcbV4VKp-V_/
            https://www.instagram.com/crestvalue/reel/DcbVpfwOwRc/
            https://www.instagram.com/crestvalue/reel/DcYY_l_sxor/
            https://www.instagram.com/crestvalue/reel/DcYYrmoJmzk/
            https://www.instagram.com/crestvalue/reel/DcYYf40PyRc/
            https://www.instagram.com/crestvalue/reel/DcYYVBStDBf/
            https://www.instagram.com/crestvalue/reel/DcYVDcux_rr/
            https://www.instagram.com/crestvalue/reel/DcXGm-cz6Dd/
            https://www.instagram.com/crestvalue/reel/DcWBjWuzetI/
          AUTHORIZED_CREATOR_HANDLES: ""
          AUTHORIZED_TEXT_CREATOR_HANDLES: ""
          AUTHORIZED_SOURCE_OWNER: "@noirwealthlifestyle"
        run: |
          python -m src.main \
            --style dark_luxury \
            --theme "${{ inputs.theme }}" \
            --copy-variant "${{ inputs.copy_variant }}" \
            --caption-variant "${{ inputs.caption_variant }}" \
            --audio "${{ inputs.audio }}" \
            --duration "${{ inputs.duration }}" \
            --clips "${{ inputs.clips }}" \
            --bpm "${{ inputs.bpm }}"
      - name: Save experiment history
        run: |
          git config user.name "zoop-factory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/generated.csv data/used_stock.csv
          if ! git diff --cached --quiet; then
            git commit -m "Record generated ZOOP experiment"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Upload ZOOP package
        uses: actions/upload-artifact@v4
        with:
          name: zoop-ready-${{ github.run_id }}
          path: |
            output/ZOOP_READY.mp4
            output/caption.txt
            output/post_card.md
            output/EXPERIMENT_ID.txt
            output/creative_plan.json
            output/audio_plan.json
            output/sources.json
            output/rights_manifest.json
          retention-days: 30
      - name: Delete temporary source footage
        if: always()
        run: rm -rf output/work
