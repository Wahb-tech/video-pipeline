name: Generate ZOOP Luxury Video

on:
  workflow_dispatch:
    inputs:
      theme:
        description: Dark luxury theme
        required: true
        type: choice
        default: auto
        options: [auto, dark_cars, money, dark_life, mixed_dark]
      copy_variant:
        description: Overlay text
        required: true
        type: choice
        default: auto
        options: [auto, pov_relationship, future_self, silent_revenge, obsession, standards, discipline, identity_shift, legacy, minimal, none]
      caption_variant:
        description: Caption style
        required: true
        type: choice
        default: auto
        options: [auto, choice, aspiration, minimal]
      audio:
        description: Known audio strategy
        required: true
        type: choice
        default: auto
        options:
          - auto
          - none
          - te_conoci_super_slowed
          - gozalo_super_slowed
          - no_era_amor_super_slowed
          - luz_roja_slowed
          - luna_bala_slowed
          - sempero_super_slowed
          - passo_bem_solto_slowed
          - montagem_fuego_super_slowed
      duration:
        description: Duration in seconds
        required: true
        default: "25"
      clips:
        description: Number of cuts
        required: true
        default: "12"
      bpm:
        description: Cut rhythm reference
        required: true
        default: "100"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-urw-base35 tesseract-ocr
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install optional Real-ESRGAN
        continue-on-error: true
        run: |
          realesrgan_root="$RUNNER_TEMP/Real-ESRGAN"
          git clone --depth 1 https://github.com/xinntao/Real-ESRGAN.git "$realesrgan_root"
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install opencv-python-headless
          python -m pip install -r "$realesrgan_root/requirements.txt"
          python -m pip install -e "$realesrgan_root"
          python - <<'PY'
          from pathlib import Path
          import site

          for root in map(Path, site.getsitepackages()):
              target = root / "basicsr" / "data" / "degradations.py"
              if target.exists():
                  content = target.read_text()
                  content = content.replace(
                      "from torchvision.transforms.functional_tensor import rgb_to_grayscale",
                      "from torchvision.transforms.functional import rgb_to_grayscale",
                  )
                  target.write_text(content)
          PY
          python "$realesrgan_root/inference_realesrgan.py" --help >/dev/null
          echo "ENABLE_AI_UPSCALE=true" >> "$GITHUB_ENV"
          echo "REALESRGAN_SCRIPT=$realesrgan_root/inference_realesrgan.py" >> "$GITHUB_ENV"
          echo "AI_UPSCALE_TIMEOUT_SECONDS=900" >> "$GITHUB_ENV"
      - name: Cache Real-ESRGAN weights
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/Real-ESRGAN/weights
            ~/.cache/torch/hub/checkpoints
          key: zoop-ai-models-v2
      - name: Generate video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          AUTHORIZED_VIDEO_URLS: |
            ${{ secrets.AUTHORIZED_VIDEO_URLS }}
            https://www.instagram.com/noirwealthlifestyle/reel/DX18E6-NS0W/
            https://www.instagram.com/noirwealthlifestyle/reel/DX4d47BN7xC/
            https://www.instagram.com/noirwealthlifestyle/reel/Db_RBfLT057/
            https://www.instagram.com/noirwealthlifestyle/reel/DaZ3ZlgN_9w/
            https://www.instagram.com/noirwealthlifestyle/reel/DaL8vDEN8bP/
            https://www.instagram.com/noirwealthlifestyle/reel/DZjYz3uIixC/
            https://www.instagram.com/noirwealthlifestyle/reel/DZcdXllNcN-/
            https://www.instagram.com/noirwealthlifestyle/reel/DZcdCBBtrdx/
            https://www.instagram.com/noirwealthlifestyle/reel/DZXuyZ4Nqwb/
            https://www.instagram.com/noirwealthlifestyle/reel/DZDTNuZtKTL/
            https://www.instagram.com/noirwealthlifestyle/reel/DYz9WmKta4b/
