name: Automatic ZOOP Content Factory

on:
  schedule:
    # Four daily runs. GitHub cron is UTC; these correspond to
    # 08:17, 12:47, 18:07 and 22:17 in Switzerland during summer time.
    # Non-round minutes also reduce GitHub Actions scheduling congestion.
    - cron: "17 6 * * *"
    - cron: "47 10 * * *"
    - cron: "7 16 * * *"
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: zoop-content-factory
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install chromium

      - name: Prepare authorized Instagram session
        env:
          INSTAGRAM_COOKIES_B64: ${{ secrets.INSTAGRAM_COOKIES_B64 }}
        run: |
          if [ -z "$INSTAGRAM_COOKIES_B64" ]; then
            echo "INSTAGRAM_COOKIES_B64 is missing"
            exit 1
          fi
          cookie_file="$RUNNER_TEMP/instagram-cookies.txt"
          printf '%s' "$INSTAGRAM_COOKIES_B64" | base64 --decode > "$cookie_file"
          if [ ! -s "$cookie_file" ]; then
            echo "Decoded Instagram cookies file is empty"
            exit 1
          fi
          chmod 600 "$cookie_file"
          echo "AUTHORIZED_COOKIES_FILE=$cookie_file" >> "$GITHUB_ENV"

      - name: Generate optimized dark-luxury video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          AUTHORIZED_VIDEO_URLS: ${{ secrets.AUTHORIZED_VIDEO_URLS }}
          AUTHORIZED_TEXT_VIDEO_URLS: ${{ secrets.AUTHORIZED_TEXT_VIDEO_URLS }}
          AUTHORIZED_CREATOR_HANDLES: ${{ secrets.AUTHORIZED_CREATOR_HANDLES }}
          AUTHORIZED_TEXT_CREATOR_HANDLES: ${{ secrets.AUTHORIZED_TEXT_CREATOR_HANDLES }}
          BANNED_STOCK_IDS: ${{ secrets.BANNED_STOCK_IDS }}
          AUTHORIZED_SOURCE_OWNER: "@noirwealthlifestyle"
          REQUIRE_AUTHORIZED_FOOTAGE: "true"
        run: |
          python -m src.main \
            --style dark_luxury \
            --theme auto \
            --copy-variant auto \
            --caption-variant auto \
            --text-mode minimal \
            --authorized-share 0.82 \
            --duration 25 \
            --clips 17 \
            --bpm 100 \
            --audio auto

      - name: Verify burned-in overlay
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("output/creative_plan.json").read_text())
          overlay = plan.get("overlay_text", "").strip()
          if not overlay:
              raise SystemExit("Missing burned-in overlay text; refusing to publish")
          print(f"Overlay verified: {overlay}")
          PY

      - name: Save experiment history
        run: |
          git config user.name "zoop-factory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/generated.csv data/used_stock.csv
          if ! git diff --cached --quiet; then
            git commit -m "Record scheduled ZOOP experiment"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Upload ZOOP package
        uses: actions/upload-artifact@v4
        with:
          name: zoop-auto-${{ github.run_id }}
          path: |
            output/ZOOP_READY.mp4
            output/caption.txt
            output/post_card.md
            output/EXPERIMENT_ID.txt
            output/creative_plan.json
            output/audio_plan.json
            output/sources.json
            output/rights_manifest.json
          retention-days: 30

      - name: Restore ZOOP session
        env:
          ZOOP_STORAGE_STATE_B64: ${{ secrets.ZOOP_STORAGE_STATE_B64 }}
        run: |
          test -n "$ZOOP_STORAGE_STATE_B64"
          printf '%s' "$ZOOP_STORAGE_STATE_B64" | base64 --decode > zoop_state.json
          chmod 600 zoop_state.json

      - name: Load generated caption
        run: |
          {
            echo 'ZOOP_CAPTION<<ZOOP_CAPTION_EOF'
            cat output/caption.txt
            echo
            echo 'ZOOP_CAPTION_EOF'
          } >> "$GITHUB_ENV"

      - name: Publish generated video to ZOOP
        env:
          ZOOP_VIDEO: output/ZOOP_READY.mp4
          ZOOP_STATE: zoop_state.json
          ZOOP_SCHEDULE_COMMIT: "1"
        run: python src/zoop_publish.py

      - name: Upload publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoop-auto-publish-${{ github.run_id }}
          path: |
            zoop_schedule_ready.png
            zoop_after_submit.png
            zoop_schedule_field_error.png
            zoop_connection_error.png
            zoop_debug.html
          if-no-files-found: ignore

      - name: Delete ZOOP session
        if: always()
        run: |
          rm -f zoop_state.json
          rm -rf output/work
