name: Test ZOOP Session

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Restore ZOOP session
        env:
          ZOOP_STORAGE_STATE_B64: ${{ secrets.ZOOP_STORAGE_STATE_B64 }}
        run: |
          test -n "$ZOOP_STORAGE_STATE_B64"
          printf '%s' "$ZOOP_STORAGE_STATE_B64" | base64 --decode > zoop_state.json
          chmod 600 zoop_state.json

      - name: Test ZOOP login
        run: python src/zoop_auth_test.py

      - name: Delete session file
        if: always()
        run: rm -f zoop_state.json
