name: Analyze ZOOP Strategy

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analyze experiments
        run: python -m src.analyze

      - name: Save report
        run: |
          git config user.name "zoop-factory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/strategy_state.json reports/latest.md
          if ! git diff --cached --quiet; then
            git commit -m "Update ZOOP strategy report"
            git pull --rebase origin main
            git push origin main
          fi
